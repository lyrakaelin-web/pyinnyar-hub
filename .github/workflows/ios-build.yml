
name: Build PYINNYAR HUB iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Generate iOS Project
        run: |
          if [ ! -d "ios/App" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      
      - name: Build iOS archive
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PyinnyarHub.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive


      - name: Build iOS archive
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PyinnyarHub.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: pyinnyar-hub-ios-archive
          path: ${{ runner.temp }}/PyinnyarHub.xcarchive
          if-no-files-found: error
